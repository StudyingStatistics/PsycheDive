<style>
:root{--desk:#2a2420;--page:#f3ecdc;--ink:#2B2234;--plum:#5B4668;--sage:#8DA399;--rose:#B8909F;--red:#b3342f;--hl:#f6dc5a;--line:#d9cfb8}
*{box-sizing:border-box}html,body{margin:0}body{background:radial-gradient(ellipse at 30% 0,#3a312b,var(--desk) 70%);color:var(--ink);font:400 16px/1.7 'Special Elite',Georgia,serif;min-height:100vh}
.hw{font-family:'Caveat',cursive}.tw{font-family:'Special Elite',monospace}h1,h2,.ser{font-family:'Playfair Display',Georgia,serif;font-weight:700;line-height:1.15}
main{max-width:860px;margin:0 auto;padding:40px 14px 90px}

.ul{display:block;height:10px;width:0;margin-top:2px;animation:ulw .8s ease-out 1.6s forwards}@keyframes ulw{to{width:min(420px,90%)}}
.ul svg{width:100%;height:10px}.ul path{stroke:var(--red);fill:none;stroke-width:2.5;stroke-linecap:round}
.scrap{position:relative;display:block;width:100%;max-width:560px;text-align:left;border:0;padding:22px 26px;margin:20px 0;cursor:pointer;color:var(--ink);background:#fffdf3;font:inherit;box-shadow:1px 3px 6px #0004;transform:rotate(var(--r));transition:transform .25s,box-shadow .25s;clip-path:polygon(0 0,100% 0,100% calc(100% - 26px),calc(100% - 26px) 100%,0 100%);filter:drop-shadow(2px 5px 5px #0003);animation:glue .6s cubic-bezier(.3,1.4,.4,1) both;animation-delay:var(--d)}
.scrap:nth-child(odd){margin-left:auto}.scrap:hover,.scrap:focus-visible{transform:rotate(calc(var(--r)*-.4)) translateY(-8px) scale(1.02);outline:none}
.scrap:focus-visible{outline:3px solid var(--plum)}
.scrap:before{content:"";position:absolute;top:-6px;left:50%;width:84px;height:24px;margin-left:-42px;background:#e8d38a99;transform:rotate(var(--t,-3deg));box-shadow:0 1px 2px #0002}
.scrap b{font:700 1.35rem 'Playfair Display',serif;display:block}.scrap small{font:1.25rem 'Caveat',cursive;color:var(--plum);display:block;line-height:1.2}
.sticky{background:#fbe98f}.aged{background:#eadfc2}
@keyframes glue{0%{transform:translateY(-40px) rotate(calc(var(--r)*3));opacity:0}60%{transform:translateY(4px) rotate(var(--r))}to{opacity:1}}
input{width:100%;max-width:560px;padding:12px 14px;border:0;border-bottom:2px solid var(--plum);background:#fffdf3aa;font:1.3rem 'Caveat',cursive;margin:10px 0}
.go,.link{font:inherit;cursor:pointer}.go{background:var(--ink);color:var(--page);border:0;padding:10px 22px;border-radius:2px 8px 2px 8px;transform:rotate(-1deg)}
.link{background:none;border:0;color:var(--plum);text-decoration:underline wavy;padding:0}.link:focus-visible,.go:focus-visible,summary:focus-visible{outline:3px solid var(--plum)}
.note{background:#fbe98f;padding:12px 16px;margin:16px 0;transform:rotate(-.6deg);box-shadow:1px 3px 5px #0003;font:1.25rem 'Caveat',cursive;max-width:560px}.err{background:#f3c9c4}
.art{font:1.08rem/1.95 Georgia,serif}.art h2{font-size:1.5rem;margin-top:1.6em}.art p:first-of-type:first-letter{font:700 3.4rem/.8 'Playfair Display';float:left;padding:6px 8px 0 0}
mark{background:linear-gradient(transparent 8%,var(--hl) 8% 92%,transparent 92%) no-repeat 0 0/0 100%;color:inherit;animation:hlr 1.1s ease-out forwards;animation-delay:calc(var(--i)*.35s + .6s);cursor:help}@keyframes hlr{to{background-size:100% 100%}}
sup{font:.7rem 'Special Elite';color:var(--red)}
.badge{display:inline-block;border:2px solid var(--red);color:var(--red);padding:2px 12px;font:.9rem 'Special Elite';transform:rotate(-2deg);letter-spacing:.03em}
.status{display:flex;flex-wrap:wrap;gap:6px 16px;margin:20px 0;font:.95rem 'Special Elite'}.status span{opacity:.4}.status .on{opacity:1;color:var(--plum)}.status .done{opacity:1}
.status .on:before{content:"● ";animation:p 1s infinite}.status .done:before{content:"✓ ";color:#3a7d4f}@keyframes p{50%{opacity:.2}}
.plan li{list-style:none;font:1.3rem 'Caveat';margin:2px 0}.plan li:before{content:"□ ";}.plan li.done:before{content:"☑ ";color:#3a7d4f}.plan li.done{text-decoration:underline wavy #3a7d4f55}
.src{position:relative;background:#fffdf3;border:1px solid var(--line);padding:12px 16px 12px 22px;margin:14px 0;box-shadow:1px 3px 5px #0002;transform:rotate(var(--r));font-size:.88rem;line-height:1.5}
.src:before{content:"";position:absolute;left:5px;top:-8px;width:12px;height:34px;border:2px solid #9aa0a6;border-radius:8px}
.src.rej{opacity:.55;text-decoration:line-through}.tag{font:.78rem 'Special Elite';color:var(--plum)}
.trace li{margin:6px 0;font-size:.9rem}.trace li:before{content:"↓ ";color:var(--red)}.conf{border:2px solid var(--red);padding:8px 12px;margin:10px 0;font:1.3rem 'Caveat';color:var(--red);transform:rotate(.6deg)}
details{font-size:.9rem;margin-top:14px}summary{cursor:pointer;font:1.2rem 'Caveat'}section{margin-top:44px}section>h2{font-size:1.7rem;margin:0 0 6px}
.rab{position:fixed;width:64px;pointer-events:none;z-index:50}.rab.cross{bottom:8px;left:-80px;animation:cr 7s linear forwards}@keyframes cr{50%{transform:translateY(-14px)}to{left:105vw}}
.rab.peek{position:absolute;width:48px;top:-34px;right:40px;animation:pk 4s ease-in-out forwards}@keyframes pk{0%,100%{transform:translateY(34px)}20%,80%{transform:none}}
.prints{position:fixed;font-size:1.2rem;color:#5b466855;z-index:40;pointer-events:none;animation:fd 6s forwards}@keyframes fd{to{opacity:0}}
.ov{position:fixed;inset:0;z-index:100;background:#000;display:grid;place-items:center;overflow:hidden}
.hole{position:absolute;left:50%;top:60%;width:90px;height:34px;margin:-17px;border-radius:50%;background:#000;box-shadow:inset 0 6px 0 #5b3a22,0 0 0 8px #3a2a1e}
.fall .hole{animation:grow 1.3s ease-in .9s forwards}@keyframes grow{to{transform:scale(60)}}
.fall .rab{position:absolute;left:-80px;top:calc(60% - 52px);animation:hop 1s ease-in-out forwards}@keyframes hop{60%{left:calc(50% - 32px);top:calc(60% - 66px)}to{left:calc(50% - 32px);top:60%;transform:scale(.1);opacity:0}}
.fall{background:var(--page);animation:fi .3s both}@keyframes fi{from{opacity:0}}
.book{position:relative;width:min(300px,70vw);aspect-ratio:3/4;perspective:1200px;animation:zoom 1.2s ease-in 3.3s forwards}
.book .pg,.book .cov{position:absolute;inset:0;border-radius:3px 10px 10px 3px}.book .pg{background:var(--page);padding:22px;font:1.6rem 'Caveat';color:var(--plum);display:grid;place-items:center;text-align:center}
.cov{background:#5b2a2a;color:#e8d7a8;padding:30px 20px;text-align:center;transform-origin:left;animation:open 1.6s ease-in-out 1.4s forwards;box-shadow:0 20px 50px #000;backface-visibility:hidden;font:700 1.8rem 'Playfair Display'}
.cov small{display:block;font:1.3rem 'Caveat';margin-top:70px;opacity:0;animation:fi 1s 1s forwards}@keyframes open{to{transform:rotateY(-170deg)}}@keyframes zoom{to{transform:scale(9);opacity:0}}
.skip{position:fixed;right:18px;bottom:18px;z-index:101;background:none;border:1px solid #fff6;color:#fffc;padding:6px 14px;cursor:pointer;font:inherit}
@media(max-width:600px){.page{padding:30px 18px 34px 34px}.page:before{left:20px}.scrap{margin-left:0!important}}
@media(prefers-reduced-motion:reduce){body:not(.p-motion) *,body:not(.p-motion) *:before{animation-duration:.01s!important;animation-delay:0s!important;transition:none!important}body:not(.p-motion) .write{clip-path:none}}
.scrap{clip-path:none;filter:none;width:fit-content;max-width:min(480px,100%);box-shadow:0 1px 1px #0002,3px 7px 12px #0004;transform:perspective(800px) rotate(var(--r)) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));-webkit-font-smoothing:antialiased;transition:transform .3s,box-shadow .3s;overflow:visible}
.scrap:after{content:"";position:absolute;right:0;bottom:0;width:28px;height:28px;background:linear-gradient(135deg,var(--page) 50%,#c9bb96 50%);box-shadow:-3px -3px 5px #0002;transition:width .3s,height .3s}
.scrap:hover,.scrap:focus-visible{transform:perspective(800px) rotate(calc(var(--r)*-.4)) translateY(-10px) scale(1.03) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));box-shadow:0 2px 2px #0002,6px 18px 26px #0005}.scrap:hover:after{width:40px;height:40px}
.swt span{display:inline-block;opacity:0;animation:swl .9s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(.25s + var(--i)*.055s)}@keyframes swl{from{opacity:0;transform:translate(var(--x),var(--y)) rotate(var(--r)) scale(.4);filter:blur(4px)}60%{opacity:1}to{opacity:1;transform:none;filter:none}}
.st{fill:none;stroke:var(--plum);stroke-width:2;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:dr1 2.2s ease var(--b,2.1s) forwards}@keyframes dr1{to{stroke-dashoffset:0}}
.cov .st{stroke:#e8d7a8;--b:.3s}.dr{width:62%;margin:0 auto}.pg>div{width:100%}
.sp{position:absolute;left:50%;top:60%;width:min(110vmin,800px);margin:calc(min(110vmin,800px)/-2) 0 0 calc(min(110vmin,800px)/-2);opacity:0;animation:spin 1.6s cubic-bezier(.5,0,.8,.6) 1.3s forwards}.sp path{fill:none;stroke:#e8d7a8;stroke-width:1.6;stroke-linecap:round}
@keyframes spin{from{transform:rotate(0) scale(.1);opacity:0}25%{opacity:.9}to{transform:rotate(620deg) scale(2.2);opacity:.6}}
.fall .pr{position:absolute;left:50%;top:60%;width:50px;margin:-25px;opacity:0;animation:pw 1.4s cubic-bezier(.2,.8,.2,1) var(--d) forwards}@keyframes pw{to{opacity:.8;transform:rotate(var(--a)) translateY(-34vmin) scale(1.2)}}
.bspin{display:block;width:150px;margin:10px 0;animation:rot 9s linear infinite}.bspin path{stroke-dasharray:1;animation:dr1 2.5s ease forwards}@keyframes rot{to{transform:rotate(360deg)}}
.chip{display:inline-block;background:#fffdf3;padding:2px 10px;margin:3px 6px 3px 0;box-shadow:1px 2px 3px #0003;transform:rotate(var(--r));font:.8rem 'Special Elite'}.chip.new{animation:fly .8s cubic-bezier(.2,.9,.3,1.2)}@keyframes fly{from{transform:translate(-120px,-60px) rotate(-25deg);opacity:0}}
.rab.cross{animation:cr 8s linear forwards,bob .45s ease-in-out infinite}@keyframes bob{50%{translate:0 -16px}}
#trail{position:fixed;left:8px;top:0;bottom:0;width:30px;z-index:44;pointer-events:none;border-left:2px dotted #e8d38a55}#trail .rab{position:absolute;left:-6px;width:34px;transition:top .25s}
@media(max-width:700px){#trail{display:none}}
/* ---- v3: spread, script type, sticky notes ---- */
h1,h2,.ser{font-family:'Great Vibes',cursive;font-weight:400;line-height:1.1}h1{font-size:clamp(2.6rem,6vw,4rem)}section>h2{font-size:2.4rem}
main{max-width:1180px}.page{max-width:860px;margin:0 auto}.art{font:400 1.15rem/1.95 Kalam,cursive}.art p:first-of-type:first-letter{font:400 4.6rem/.75 'Great Vibes'}
.swt .w{display:inline-block;white-space:nowrap}.swt .w span{display:inline-block;opacity:0;animation:swl .9s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--b0,0s) + .2s + var(--i)*var(--st,.055s));transition:translate .55s cubic-bezier(.2,1.7,.4,1),rotate .55s}
.fly{--st:.03s}.fly .w span{animation-duration:1.5s}.still .swt .w span{animation:none;opacity:1}
.spread{position:relative;display:grid;grid-template-columns:1fr 1fr;border-radius:6px;box-shadow:0 2px 0 #e6dcc4,0 6px 0 #d8cdb2,0 10px 0 #cfc3a6,0 28px 50px #000a}
.spread:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:44px;margin-left:-22px;background:linear-gradient(90deg,transparent,#0002 42%,#0004 50%,#0002 58%,transparent);z-index:3;pointer-events:none}
.pgL,.pgR{padding:32px 40px 40px;min-height:640px}.pgL{border-radius:6px 0 0 6px;padding-left:64px;position:relative;background:repeating-linear-gradient(transparent 0 31px,#d6cbb0 31px 32px),#f3ecdc}
.pgL:before{content:"";position:absolute;left:46px;top:0;bottom:0;border-left:2px solid #d9777a66}
.pgR{border-radius:0 6px 6px 0;background:radial-gradient(#bfb293 1.5px,transparent 1.8px) 8px 8px/24px 24px,#f6f0e1}
.pgL h1,.pgL h2{line-height:64px;margin:0;font-size:3rem}.pgL h2{font-size:2.5rem;color:var(--plum)}.pgL p,.pgL li{font:400 15.5px/32px Kalam,cursive;margin:0 0 32px;color:#3a3042}.pgL ul{margin:0 0 32px;padding:0;list-style:none}.pgL li{margin:0;padding-left:22px;position:relative}.pgL li:before{content:"✿";position:absolute;left:0;color:var(--rose)}
.pgL .tg{margin:0;font-size:13px}.wipe{clip-path:inset(0 100% 0 0);animation:wr 1.5s ease var(--wd,0s) forwards}.still .wipe{animation:none;clip-path:none}
.board{display:flex;flex-wrap:wrap;gap:30px 34px;padding:14px 4px 6px}
.stk{position:relative;display:block;width:212px;min-height:176px;padding:34px 20px 20px;border:0;text-align:left;cursor:pointer;color:var(--ink);background:linear-gradient(180deg,#0000000d 0 20px,transparent 20px),var(--c);transform:rotate(var(--r));transform-origin:50% 0;box-shadow:0 1px 1px #0002,3px 9px 10px -5px #0006;transition:transform .3s,box-shadow .3s;font:inherit;-webkit-font-smoothing:antialiased;animation:sway 6s ease-in-out calc(var(--d,0s) + 1s) infinite}
.stk.in{animation:stick .95s cubic-bezier(.3,.8,.3,1) var(--d) both,shd .95s var(--d) both,sway 6s ease-in-out calc(var(--d) + 1s) infinite}
.stk:nth-child(2){margin-top:34px}.stk:after{content:"";position:absolute;inset:auto 0 0 auto;width:34px;height:34px;background:linear-gradient(135deg,transparent 50%,#0003 50%,#fff8 100%);transition:width .3s,height .3s}.stk:hover:after{width:52px;height:52px}
.stk:hover,.stk:focus-visible{transform:rotate(calc(var(--r)*-.3)) translateY(-8px) scale(1.04);box-shadow:0 2px 2px #0002,6px 20px 22px -6px #0006;outline:none}.stk:focus-visible{outline:3px solid var(--plum)}
.stk b{display:block;font:400 2.1rem/1.05 'Great Vibes',cursive}.stk small{display:block;font:1.3rem/1.15 Caveat,cursive;color:#4b3b5a;margin-top:8px}
@keyframes stick{0%{transform:translate(-110px,-300px) rotate(calc(var(--r) - 30deg)) scale(1.4);opacity:0}45%{opacity:1}68%{transform:translate(0,7px) rotate(var(--r)) scale(1.08)}84%{transform:translate(0,-2px) rotate(var(--r)) scale(.99)}to{transform:rotate(var(--r))}}
@keyframes shd{from{box-shadow:0 40px 40px -10px #0004}to{box-shadow:0 1px 1px #0002,3px 9px 10px -5px #0006}}
@keyframes sway{0%,100%{rotate:-1.6deg}50%{rotate:2deg}}@keyframes show{to{opacity:1}}
.idx{background:#fffdf3;padding:14px 18px 18px;margin:26px 0 8px;max-width:440px;transform:rotate(-.7deg);box-shadow:1px 4px 8px #0003}.idx input{margin:0 0 10px}
.cov{font:400 2.7rem/1.05 'Great Vibes',cursive}.book{animation-delay:6.5s;animation-duration:1.3s}.book .pg{font:400 2.2rem/1.1 'Great Vibes',cursive}.book .pg .dr{width:78%;display:block;margin:0 auto 6px;overflow:visible}
@media(max-width:820px){.spread{grid-template-columns:1fr}.spread:before{display:none}.pgL,.pgR{min-height:0;border-radius:6px}.pgL{padding-left:56px}.stk{width:calc(50% - 17px);min-width:150px}}
/* ---- v4: settings, themes, follow-ups, report ---- */
#pawb{position:fixed;top:14px;right:14px;z-index:160;width:46px;height:46px;border-radius:50%;border:0;background:#fffdf3;box-shadow:0 3px 10px #0006;cursor:pointer;display:grid;place-items:center;transition:transform .25s}#pawb:hover{transform:rotate(-12deg) scale(1.08)}#pawb:focus-visible,.sw:focus-visible{outline:3px solid var(--plum)}

.stk,.note,#setp{color:#2B2234}.page.still{animation:none}

/* ---- v5: PsycheDive — pen motion, font control, suggestions, depth picker ---- */

.pen{position:absolute;left:0;bottom:-4px;width:100%;height:38px;overflow:visible;pointer-events:none}

async function llm(system,user,o={}){

    for(let i=0;i<2;i++){
      const body={model,temperature:o.temp??.4,max_tokens:(o.max??2000)+(/gpt-oss|qwen/.test(model)?1500:0),messages:[{role:'system',content:system},{role:'user',content:user}]};
      if(o.json)body.response_format={type:'json_object'};
      if(/gpt-oss/.test(model))body.reasoning_effort='low';
      let r;try{r=await callAI('/chat/completions',body)}catch(e){throw new Error('Could not reach Groq. Check your internet connection.')}
      if(r.status===401)throw new Error('Groq rejected your API key. Click "Change key" and paste it again.');
      if(r.status===429){last='rate limit on '+model;if(i===0){await new Promise(s=>setTimeout(s,3000));continue}break}
      if(!r.ok){last=model+' error '+r.status;if([400,403,404].includes(r.status))BAD.add(model);break}

 const names=[...new Set([...B.map(x=>x.c),...DB.ebm.log.map(e=>e.c)])];
 const r=await llm(GS,`Concepts already used, or already covered by the learner (never repeat them or close variants): ${names.join(', ')}. Return {items:[${need} of ${g.spec}]}`,{json:true,max:1800,temp:.9});
 const add=(r.items||[]).filter(g.ok).map(g.mk).filter(x=>{const k=key1(x);if(!k||have.has(k))return false;have.add(k);return true});
 add.forEach(x=>{B.push(x);DB.ebm.gen[f].push(x)});save();return add}
async function ebmRefresh(f){if(E.ref||E.busy)return;const B=BANK[f],n=PS[f],cs=covSet(),seen=new Set(DB.ebm.seen[f]),cur=new Set(DB.ebm.sh[f]);
 let pick=shuffle(B.filter(x=>!cs.has(key1(x))&&!seen.has(key1(x)))).slice(0,n);E.rmsg='';
 if(pick.length<n&&KEY()){E.ref=f;ebmPaint();
  try{const add=await genMore(f,n-pick.length+2);pick=pick.concat(add).slice(0,n)}
  catch(e){E.rmsg='Could not fetch new ones just now: '+e.message}
  E.ref=null}
 if(pick.length<n){const h=new Set(pick.map(key1));pick=pick.concat(shuffle(B.filter(x=>!cs.has(key1(x))&&!cur.has(key1(x))&&!h.has(key1(x)))).slice(0,n-pick.length))}
 if(!pick.length){E.rmsg=KEY()?(E.rmsg||'You have covered everything in this list. Try again in a moment for brand-new ones.'):'You have covered everything in this list. Add your Groq key to get brand-new ones.';ebmPaint();return}
 DB.ebm.sh[f]=pick.map(key1);pick.forEach(x=>seen.add(key1(x)));DB.ebm.seen[f]=[...seen];save();ebmPaint();const m=document.getElementById('ebmain');if(m)m.scrollTop=0}
/* Today's question is remembered for the day and has its own refresh */
function todayItem(){const T=DB.ebm.today=DB.ebm.today||{},d=dk(Date.now());
 if(T.d!==d||!T.k){const cs=covSet(),pool=EBY.filter(x=>!cs.has(key1(x))),it=pool.length?pick1(pool):EBY[0];T.d=d;T.k=key1(it);T.seen=[T.k];save()}
 const i=EBY.findIndex(x=>key1(x)===T.k);return i<0?0:i}
function pick1(a){return a[Math.random()*a.length|0]}
async function ebmTodayNew(){if(E.ref||E.busy)return;const T=DB.ebm.today,cs=covSet();E.rmsg='';
 let pool=EBY.filter(x=>!cs.has(key1(x))&&!T.seen.includes(key1(x)));
 if(!pool.length&&KEY()){E.ref='q';ebmPaint();try{pool=(await genMore('y',4)).filter(x=>!cs.has(key1(x)))}catch(e){E.rmsg='Could not fetch new ones just now: '+e.message}E.ref=null}
 if(!pool.length)pool=EBY.filter(x=>!cs.has(key1(x))&&key1(x)!==T.k);
 if(!pool.length){E.rmsg=KEY()?(E.rmsg||'You have covered every question for now. Try again in a moment.'):'You have covered every question. Add your Groq key to get brand-new ones.';ebmPaint();return}
 const it=pick1(pool);T.k=key1(it);T.seen.push(T.k);save();ebmPaint()}
const rbtn=f=>`<div style="margin:6px 0 4px"><button class="go" ${E.ref||E.busy?'disabled':''} onclick="ebmRefresh('${f}')">${E.ref===f?'Finding new ones...':'🔄 Show new ones'}</button></div>${E.rmsg?`<div class="note err" style="transform:none;font-size:1.1rem">${esc(E.rmsg)}</div>`:''}`;
const shown=f=>DB.ebm.sh[f].map(k=>BANK[f].findIndex(x=>key1(x)===k)).filter(i=>i>=0);
const coveredList=f=>{const seen=new Set(),L=DB.ebm.log.filter(e=>e.f===f).sort((a,b)=>b.ts-a.ts).filter(e=>!seen.has(e.k)&&seen.add(e.k));
 return L.length?`<details style="margin:22px 0"><summary class="ebl" style="cursor:pointer">✓ Covered so far (${L.length})</summary>${L.map(e=>`<p class="tag" style="margin:6px 0">${esc(e.c)} · ${new Date(e.ts).toLocaleDateString(undefined,{day:'numeric',month:'short'})} <button class="link" onclick="ebmOpen(${esc(JSON.stringify(e.c))},'${f}')">open</button></p>`).join('')}</details>`:''};

/* ---- myth check: reuses searchAll, extractClaims, llm, clean ---- */
const MS='You are a careful psychology explainer. Using ONLY the verified claims given, say what the research found about the popular belief. Never add statistics, names, dates or studies that are not in the claims. Put [n] after every factual sentence. If the claims do not address the belief, set stance to "unclear". Education only: never diagnose and never claim to know what any reader thinks or feels. Return JSON {stance:"contradicts|partly supports|supports|unclear", says:"2 to 4 sentences"}.';
async function mythCheck(i){const m=EBM_[i];if(!m||E.busy)return;if(!KEY()){setKey();if(!KEY())return}
 E.busy=m.id;E.mlog=[];E.merr='';const L=t=>{E.mlog.push(t);if(E.tab==='myth')ebmPaint()};L('Searching research databases...');
 try{const raw=(await Promise.all(m.q.map(searchAll))).flat(),dd=new Map();
  raw.forEach(s=>s.title&&s.abstract&&s.abstract.length>200&&!dd.has(norm(s.title))&&dd.set(norm(s.title),s));
  const sources=[...dd.values()].slice(0,8).map((s,k)=>({...s,n:k+1}));L('Checking claims from '+sources.length+' sources against their abstracts...');
  const claims=sources.length?await extractClaims(sources,m.topic):[],good=claims.filter(c=>c.verification==='verified');
  const res={ts:Date.now(),ok:false,nv:good.length,ns:new Set(good.map(c=>c.source_n)).size,claims:good.map(c=>({claim:c.claim,source_n:c.source_n,evidence_type:c.evidence_type})),sources:sources.map(s=>({n:s.n,title:s.title,year:s.year,url:s.url}))};
  if(good.length>=2){L('Writing only from the verified claims...');
   const ctx=`Popular belief: "${m.myth}"\nVerified claims:\n${good.map(c=>`- ${c.claim} [${c.source_n}] (${c.evidence_type})`).join('\n')}`,r=await llm(MS,ctx,{json:true,max:900,temp:.3}),says=clean(String(r.says||''),ctx,sources).trim();
   if(r.stance&&r.stance!=='unclear'&&says.length>40){res.ok=true;res.says=says;res.stance=r.stance;res.label=evRule(good)}}
  DB.ebm.myth[m.id]=res;ebLog('m',m.c,null);save()}catch(e){E.merr=e.message}
 E.busy=null;E.mlog=[];ebmPaint()}

/* each weekday has a category; each calendar date keeps the subtopic it was given */
const WKC={0:['Sunday','Weird psychology'],1:['Monday','Memory'],2:['Tuesday','Attention'],3:['Wednesday','Decision-making'],4:['Thursday','Emotion'],5:['Friday','Social behaviour'],6:['Saturday','Cognitive bias']};
const WKS={
 'Memory':['Reconstructive memory','Misinformation effect','Spacing effect','Testing effect','Levels of processing','Serial position effect','Memory consolidation','Flashbulb memory','Encoding specificity principle','Retrieval-induced forgetting','Source monitoring','Prospective memory'],
 'Attention':['Inattentional blindness','Change blindness','Selective attention','Attentional blink','Divided attention','Stroop effect','Visual search','Inhibition of return','Vigilance decrement','Cocktail party effect','Attentional capture','Mind wandering'],
 'Decision-making':['Loss aversion','Framing effect','Prospect theory','Choice overload','Sunk cost effect','Status quo bias','Decision fatigue','Default effect','Satisficing','Endowment effect','Planning fallacy','Present bias'],
 'Emotion':['Affect labeling','Emotion regulation','Cognitive reappraisal','Emotional contagion','Mood-congruent memory','Misattribution of arousal','Facial feedback hypothesis','Hedonic adaptation','Emotional granularity','Display rules','Affective forecasting','Affect heuristic'],
 'Social behaviour':['Social facilitation','Bystander effect','Conformity','Social loafing','Obedience to authority','Group polarization','Groupthink','In-group bias','Social proof','Diffusion of responsibility','Pluralistic ignorance','Mere exposure effect'],
 'Cognitive bias':['Availability heuristic','Confirmation bias','Anchoring effect','Hindsight bias','Overconfidence effect','Self-serving bias','Halo effect','Survivorship bias','Optimism bias','Belief perseverance','Illusory correlation','Fundamental attribution error'],
 'Weird psychology':['Pareidolia','Semantic satiation','Mandela effect','Synesthesia','Rubber hand illusion','Déjà vu','McGurk effect','Barnum effect','Placebo effect','Phantom vibration','Chronostasis','Illusion of explanatory depth']};
DB.ebm.wk=DB.ebm.wk||{};DB.ebm.wkgen=DB.ebm.wkgen||{};
const fmt=d=>d.toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'});
const wkDays=()=>Array.from({length:7},(_,o)=>{const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+o);return d});
function wkAssign(){const W=DB.ebm.wk,used=new Set(Object.values(W).map(x=>norm(x.c))),cs=covSet();
 wkDays().forEach(d=>{const k=dk(d);if(W[k])return;const cat=WKC[d.getDay()][1],pool=[...WKS[cat],...(DB.ebm.wkgen[cat]||[])];
  let av=pool.filter(c=>!used.has(norm(c))&&!cs.has(norm(c)));if(!av.length)av=pool.filter(c=>!used.has(norm(c)));if(!av.length)av=pool;
  const c=pick1(av);W[k]={cat,c,done:false};used.add(norm(c))});save()}
async function wkSwap(k){const W=DB.ebm.wk[k];if(!W||W.done||E.ref||E.busy)return;const cat=W.cat,cs=covSet();E.rmsg='';
 const used=()=>new Set(Object.values(DB.ebm.wk).map(x=>norm(x.c))),avail=()=>{const u=used();return[...WKS[cat],...(DB.ebm.wkgen[cat]||[])].filter(c=>!u.has(norm(c))&&!cs.has(norm(c)))};
 let av=avail();
 if(!av.length&&KEY()){E.ref='w';ebmPaint();
  try{const names=[...new Set([...Object.values(DB.ebm.wk).map(x=>x.c),...DB.ebm.log.map(e=>e.c)])],r=await llm(GS,`Category: ${cat}. Concepts already used or covered (never repeat them or close variants): ${names.join(', ')}. Return {items:[6 of {c:"an established psychology concept name that researchers study within this category"}]}`,{json:true,max:600,temp:.9});
   const u=used(),add=(r.items||[]).map(x=>String((x&&x.c)||'').trim()).filter(c=>c&&!u.has(norm(c))&&!cs.has(norm(c)));DB.ebm.wkgen[cat]=[...(DB.ebm.wkgen[cat]||[]),...add];av=avail()}
  catch(e){E.rmsg='Could not fetch new subtopics just now: '+e.message}E.ref=null}
 if(!av.length){E.rmsg=E.rmsg||(KEY()?'No fresh subtopics came back. Try again in a moment.':'No fresh subtopics are left in this category. Add your Groq key to get more.');ebmPaint();return}
 W.c=pick1(av);save();ebmPaint()}

const PD_GROUPS=[
 {id:'brain',ic:'🧠',name:'BRAIN',topics:['Memory','Attention','Perception','Learning','Decision-making']},
 {id:'mind',ic:'💭',name:'MIND',topics:['Emotion','Motivation','Thinking','Creativity','Stress']},

const PD_TOPICS=[...new Set(PD_GROUPS.flatMap(g=>g.topics))];
const pdGroupOf=topic=>{const g=PD_GROUPS.find(x=>x.topics.includes(topic));return g?g.id:'other'};
const PD_KW={

};
function pdClassify(text){
 const s=String(text||'').toLowerCase();
 if(!s.trim())return{topic:'',group:''};
 let best='',len=0;
 for(const t in PD_KW)for(const k of PD_KW[t])if(s.includes(k)&&k.length>len){best=t;len=k.length}
 if(best)return{topic:best,group:pdGroupOf(best)};
 for(const t of PD_TOPICS)if(s.includes(t.toLowerCase()))return{topic:t,group:pdGroupOf(t)};
 return{topic:'',group:''};
}

/* ---------- 2. LEARNER STATE (versioned, migrating, non-destructive) ------ */
function pdDefaults(){return{
 version:PD_VER,created:pnow(),migrated:false,
 learnerProfile:{interests:{},seenConcepts:{},first:{},topics:{},lastExplanation:'',lastExplanationAt:0},
 activityHistory:[],topicRatings:{},reflectionHistory:[],pointsHistory:[],
 points:{total:0,awards:{}},streakData:{current:0,longest:0,lastActive:'',days:[]},
 calendarActivity:{},gameProgress:{},researchProgress:{seen:[],cache:[],checks:{}},
 recommendationHistory:[],achievements:{},unlockedGames:{},
 dailyResearch:{},dailyBrain:{},nibbles:{last:'',lastDay:''},settings:{}
}}
function pdDayRec(){return{concepts:[],types:{},points:0,count:0}}
function pdTouchDay(rec,st){
 st=st||LS;const d=pdDay(rec.ts);
 const c=st.calendarActivity[d]=st.calendarActivity[d]||pdDayRec();
 c.count++;c.types[rec.type]=(c.types[rec.type]||0)+1;
 if(rec.topic&&!c.concepts.includes(rec.topic))c.concepts.push(rec.topic);
 if(rec.points)c.points+=rec.points;
 return c;
}
const PD_MEANINGFUL=new Set(['concept_opened','concept_completed','related_concept','article_read','deep_report','rabbit_hole','game_played','exercise_completed','daily_brain','tiny_experiment','research_read','research_questions','reflection','myth_check','week_day','topic_rated','recommendation_accepted']);
const PD_W={concept_opened:1,concept_completed:2,related_concept:2.5,article_read:2,deep_report:4,rabbit_hole:3,game_played:2,exercise_completed:2,daily_brain:2,tiny_experiment:2,research_read:3,research_questions:3,reflection:3,myth_check:2.5,week_day:2.5,recommendation_accepted:1.5,recommendation_skipped:-0.75,question_asked:0.5,pdf_export:0.5,depth_selected:0.2,topic_rated:0.5};
function pdMigrate(st){
 const have=new Set(st.activityHistory.map(a=>a.type+'|'+(a.itemId||a.ts)));
 const add=(type,ts,c,itemId,meta)=>{const k=type+'|'+(itemId||ts);if(have.has(k))return;have.add(k);
  const cls=pdClassify(c);const r={id:'m'+ts.toString(36)+Math.random().toString(36).slice(2,5),type:type,ts:ts||pnow(),concept:c||'',topic:cls.topic,group:cls.group,category:'',itemId:itemId||'',meta:meta||{migrated:1}};
  st.activityHistory.push(r);if(r.topic){st.learnerProfile.seenConcepts[r.topic]=(st.learnerProfile.seenConcepts[r.topic]||0)+1;if(!st.learnerProfile.first[r.topic])st.learnerProfile.first[r.topic]=r.ts}};
 try{((DB.ebm||{}).log||[]).forEach(e=>{
  const f=e.f;add(f==='q'?'daily_brain':f==='e'?'tiny_experiment':f==='w'?'week_day':f==='m'?'myth_check':f==='s'?'concept_completed':'concept_opened',e.ts,e.c,e.art||norm(e.c),{f:f,gm:e.gm});
 })}catch(e){}
 try{const P=((DB.ebm||{}).games||{}).played||{};Object.keys(P).forEach(k=>{st.gameProgress['legacy_'+k]=st.gameProgress['legacy_'+k]||{plays:0,best:0,bestLabel:'',last:null,legacy:1};st.gameProgress['legacy_'+k].plays++;st.gameProgress['legacy_'+k].last=P[k]})}catch(e){}
 try{const g=JSON.parse(localStorage.rh_game||'null');if(g&&(g.total||g.best))st.gameProgress.legacy_guess={plays:g.total||0,best:g.best||0,bestLabel:'',last:null,legacy:1}}catch(e){}
 try{const ds=JSON.parse(localStorage.rh_ds||'{}');if(ds&&Object.keys(ds).length)st.settings.depthSpecs=1}catch(e){}
 st.activityHistory.sort((a,b)=>a.ts-b.ts);
 st.activityHistory.forEach(r=>pdTouchDay(r,st));
 st.migrated=true;return st;
}
let LS=(function(){
 let st=null;const raw=pLS.get(PD_KEY);
 if(raw){try{st=JSON.parse(raw)}catch(e){st=null}}

 st.version=PD_VER;
 if(!st.migrated){try{pdMigrate(st)}catch(e){}}
 return st;
})();

  concept:concept,topic:o.topic||cls.topic,group:o.group||cls.group,category:o.category||'',itemId:o.itemId||'',meta:o.meta||null};

function pdStreak(){
 const days=new Set(Object.keys(LS.calendarActivity).filter(d=>(LS.calendarActivity[d].count||0)>0&&Object.keys(LS.calendarActivity[d].types||{}).some(t=>PD_MEANINGFUL.has(t))));
 let cur=0;const d=new Date();
 if(!days.has(pdDay(d.getTime())))d.setDate(d.getDate()-1);
 while(days.has(pdDay(d.getTime()))){cur++;d.setDate(d.getDate()-1)}
 const sorted=[...days].sort();
 let longest=LS.streakData.longest||0,run=0,prev='';
 sorted.forEach(k=>{if(prev){const a=new Date(prev+'T12:00:00'),b=new Date(k+'T12:00:00');run=(Math.round((b-a)/86400000)===1)?run+1:1}else run=1;longest=Math.max(longest,run);prev=k});
 LS.streakData={current:cur,longest:Math.max(longest,cur),lastActive:sorted[sorted.length-1]||'',days:sorted.slice(-400)};
 return LS.streakData;
}

 return{...cur,index:i,next:nx||null,toNext:nx?Math.max(0,nx.need-t):0,pct:nx?Math.round((t-cur.need)/(nx.need-cur.need)*100):100}}

/* ---------- 5. LEARNING FINGERPRINT (interests, never traits) ------------- */
function pdRecency(ts){const days=(pnow()-ts)/86400000;return days<3?1:days<10?.7:days<30?.45:.25}
function pdInterestRaw(){
 const A=LS.activityHistory,sc={};
 A.forEach(a=>{
  if(!a.topic)return;const w=(PD_W[a.type]==null?0:PD_W[a.type]);
  sc[a.topic]=(sc[a.topic]||0)+w*pdRecency(a.ts);
 });
 Object.keys(LS.topicRatings).forEach(t=>{const r=LS.topicRatings[t];if(!r)return;sc[t]=(sc[t]||0)+(r.stars-3)*2.2});
 return sc;
}
function pdInterest(){
 const sc=pdInterestRaw();
 const rows=Object.keys(sc).map(t=>({topic:t,group:pdGroupOf(t),score:sc[t],opens:LS.learnerProfile.seenConcepts[t]||0,rating:(LS.topicRatings[t]||{}).stars||0}))
  .filter(r=>r.score>0.4).sort((a,b)=>b.score-a.score);
 const max=rows.length?rows[0].score:1;
 rows.forEach(r=>r.pct=Math.max(4,Math.min(100,Math.round(r.score/max*100))));
 const gs={};rows.forEach(r=>{gs[r.group]=(gs[r.group]||0)+r.score});
 const gmax=Math.max(1,...Object.values(gs));
 const groups=PD_GROUPS.map(g=>({id:g.id,ic:g.ic,name:g.name,pct:Math.round((gs[g.id]||0)/gmax*100),raw:gs[g.id]||0})).filter(g=>g.raw>0).sort((a,b)=>b.raw-a.raw);
 return{rows:rows.slice(0,10),all:rows,groups,top:rows.slice(0,3).map(r=>r.topic)};
}
function pdExplainLocal(){
 const I=pdInterest();
 if(!I.rows.length)return'Your brain map fills in as you explore. Open a concept, read a research trail or play a game and it starts to take shape.';
 const top=I.rows.slice(0,3).map(r=>r.topic);
 const loved=Object.keys(LS.topicRatings).filter(t=>LS.topicRatings[t].stars>=4);
 const recent=LS.activityHistory.slice(-40).map(a=>a.topic).filter(Boolean);
 const recentTop=[...new Set(recent)].slice(0,3);
 let s='Your recent activity inside PsycheDive suggests a growing interest in '+top.slice(0,2).join(' and ').toLowerCase();
 if(recentTop.length&&!top.includes(recentTop[0]))s+=' — most recently in '+recentTop[0].toLowerCase();
 s+='.';
 if(loved.length)s+=' You rated '+loved.slice(0,3).join(', ').toLowerCase()+' highly, so those will keep coming back.';
 return s;
}
async function pdExplainAI(){
 const I=pdInterest();
 const payload={topics:I.rows.map(r=>({topic:r.topic,engagement:r.opens,rating:r.rating})),recent:LS.activityHistory.slice(-25).map(a=>({type:a.type,topic:a.topic})),streak:LS.streakData.current,level:pdLevel().name};

function pdRecs(n){
 n=n||3;const I=pdInterest(),sc={};
 PD_TOPICS.forEach(t=>{
  const row=I.all.find(r=>r.topic===t);
  let s=row?row.score:0.35;                      // exploration floor keeps low-rated topics alive
  const r=LS.topicRatings[t];
  if(r){if(r.stars>=4)s+=2.2;else if(r.stars<=2)s-=1.4}
  I.top.forEach((tp,i)=>{if(pdRelatedTo(tp).includes(t))s+=1.1-i*0.25});
  const last=LS.activityHistory.filter(a=>a.topic===t).pop();
  if(last){const days=(pnow()-last.ts)/86400000;if(days<3)s-=2.2;else if(days<10)s-=0.9}
  LS.recommendationHistory.filter(h=>h.topic===t).forEach(h=>{if(h.status==='skipped')s-=0.8;if(h.status==='pending'&&pnow()-h.ts<86400000*3)s-=1.5;if(h.status==='accepted')s-=0.3});
  sc[t]=s;
 });
 const out=[];
 for(let k=0;k<n;k++){
  const avail=Object.keys(sc).filter(t=>!out.some(o=>o.topic===t));
  if(!avail.length)break;
  avail.sort((a,b)=>sc[b]-sc[a]);
  const pick=avail[Math.random()<0.75?0:Math.min(avail.length-1,Math.floor(Math.random()*2))]||avail[0];
  const related=I.top.find(tp=>pdRelatedTo(tp).includes(pick));
  out.push({id:'r'+pnow().toString(36)+Math.random().toString(36).slice(2,5),topic:pick,group:pdGroupOf(pick),ts:pnow(),status:'pending',
   why:pdRecWhy(pick,related),related:pdRelatedTo(pick).slice(0,4),hook:PD_HOOKS[pick]||('A quieter corner of '+pick.toLowerCase()+' you have not opened yet.')});
  delete sc[pick];
 }
 return out;
}

   if(fromGame){pdLog('related_concept',{concept:topic,itemId:topic,meta:{game:fromGame}});pdAward('related_concept',topic+':'+pdDay(),10,'Related concept explored')}
   this.go(topic)},

/* ---------- shared result renderer: the required six-step loop ---------- */
function pdGameResult(o){
 const g=GAMES.find(x=>x.id===o.id)||{};
 const rel=(o.related||pdRelatedTo(o.concept)).slice(0,5);
 const P=LS.gameProgress[o.id]=LS.gameProgress[o.id]||{plays:0,best:0,bestLabel:'',last:null};
 P.plays++;P.last=pnow();
 if(o.score!=null&&(P.best==null||o.score>P.best)){P.best=o.score;P.bestLabel=o.label||''}
 pdLog('game_played',{concept:o.concept,itemId:o.id,meta:{score:o.score,label:o.label}});
 pdAward('game_played',o.id,20,'Game played: '+(g.name||o.id));
 pdCheckUnlocks();pdSave();

/* =========================================================================
   4) NO-REPEAT GAME QUESTIONS
   Tracks which case / scenario each game has already shown. "Next case"
   now walks through the unseen ones; when the whole set has been used it
   resets and starts again (never repeating the one you are on).
   ========================================================================= */
var SEEN={};
try{SEEN=JSON.parse(St.get('rh_seen','{}'))||{}}catch(e){SEEN={}}
if(typeof SEEN!=='object'||!SEEN)SEEN={};
function seenSave(){St.set('rh_seen',JSON.stringify(SEEN))}
var POOLS={
  guess:function(){return (typeof PD_CASES!=='undefined')?PD_CASES.length:0},
  file:function(){return (typeof PD_FILES!=='undefined')?PD_FILES.length:0},
  soc:function(){return (typeof PD_SOC!=='undefined')?PD_SOC.length:0},
  bias:function(){return (typeof PD_BIAS!=='undefined')?PD_BIAS.length:0},
  dots:function(){return (typeof PD_PAIRS!=='undefined')?PD_PAIRS.length:0}
};
function poolLen(gid){try{return POOLS[gid]?POOLS[gid]():0}catch(e){return 0}}
function nextIndex(gid,len,cur){
  if(!(len>1))return 0;
  var a=SEEN[gid];if(!Array.isArray(a))a=[];
  a=a.filter(function(x){return Number.isInteger(x)&&x>=0&&x<len});
  var avail=[],i;
  for(i=0;i<len;i++)if(a.indexOf(i)<0&&i!==cur)avail.push(i);
  if(!avail.length){a=[];for(i=0;i<len;i++)if(i!==cur)avail.push(i);if(!avail.length)avail.push(0)}
  var pick=avail[Math.floor(Math.random()*avail.length)];
  a.push(pick);
  if(a.length>=len)a=[pick];
  SEEN[gid]=a;seenSave();
  return pick;
}
window.pdaSeenReset=function(){SEEN={};seenSave();T('Game question memory cleared. Every case can appear again.')};
window.pdaSeenCount=function(gid){var a=SEEN[gid];return Array.isArray(a)?a.length:0};

function wireNoRepeat(){
  try{
    if(typeof PDX==='object'&&PDX){
      if(typeof PDX.open==='function'){
        var _open=PDX.open.bind(PDX);
        PDX.open=function(k){
          var r=_open(k);
          try{
            if(k&&k!=='hub'&&PDX.game&&PDX.g&&PDX.g.i==null){
              var L=poolLen(k);
              if(L>1){PDX.g.i=nextIndex(k,L,null);if(typeof PDX.paint==='function')PDX.paint()}
            }
          }catch(e){}
          return r;
        };
      }
      if(typeof PDX.gset==='function'){
        var _gset=PDX.gset.bind(PDX);
        PDX.gset=function(patch){
          try{
            if(patch&&Object.prototype.hasOwnProperty.call(patch,'i')&&PDX.game&&PDX.g){
              var L2=poolLen(PDX.game);
              if(L2>1){
                var np={},k;for(k in patch)if(Object.prototype.hasOwnProperty.call(patch,k))np[k]=patch[k];
                np.i=nextIndex(PDX.game,L2,PDX.g.i);
                patch=np;
              }
            }
          }catch(e){}
          return _gset(patch);
        };
      }
    }
  }catch(e){}
  /* the classic "Guess me" game draws at random and can repeat itself */
  try{
    if(typeof window.guessNew==='function'){
      var _gn=window.guessNew,last='';
      window.guessNew=function(){

async function tavilySearch(query,max){
  var q=String(query||'').trim();if(!q)return [];
  var n=Math.max(1,Math.min(parseInt(max,10)||5,20));
  var b=backend();
  if(b&&b.tavily){
    try{
      var r=await window.fetch('/api/tavily/search',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:q,max_results:n})});
      if(r.ok){var j=await r.json();return (j&&j.results)||[]}
    }catch(e){}
  }
  var tk=TKEY();if(!tk)return [];
  try{
    var r2=await window.fetch('https://api.tavily.com/search',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({api_key:tk,query:q,max_results:n})});
    if(r2.ok){var j2=await r2.json();return (j2&&j2.results)||[]}
  }catch(e){}
  return [];
}

  T('Asking Tavily\u2026',4000);

  var concepts=uniq(arts.map(function(a){return a.title}).concat(acts.filter(function(r){return/concept_opened|concept_completed|article_read/.test(r.type)}).map(function(r){return r.concept})));
  return{k:k,arts:arts,acts:acts,concepts:concepts,
   qs:acts.filter(function(r){return r.type==='question_asked'}).map(function(r){return r.itemId}),
   trails:uniq(arts.reduce(function(m,a){return m.concat((a.next_holes||[]).map(function(h){return h.name}))},[]).concat(acts.filter(function(r){return r.type==='related_concept'}).map(function(r){return r.concept}))),
   bms:bmList().filter(function(b){return b.at&&pdDay(Date.parse(b.at))===k}).map(function(b){return b.name}),
   refl:(LS.reflectionHistory||[]).filter(function(r){return pdDay(r.ts)===k}),
   cats:uniq(concepts.map(function(c){var d=DB.concepts[norm(c)];return d&&d.category}).concat(acts.map(function(r){return r.topic})))}}
function dayLabel(k){var d=new Date(k+'T12:00:00');return d.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'})}
function dayText(D){var P=[],n=D.concepts.length;
  if(n)P.push('Concepts explored ('+n+'): '+D.concepts.join(', ')+'.');
  D.arts.forEach(function(a){var v=(a.claims||[]).filter(function(c){return c.verification==='verified'}).length;P.push('Read “'+a.title+'” at '+(a.depthLabel||'an earlier')+' depth: '+(a.words||0)+' words, '+(a.sources||[]).length+' sources, '+v+' verified claims'+(a.deep?', deep report written':'')+'.')});
  if(D.qs.length)P.push('Follow-up questions asked ('+D.qs.length+'): '+D.qs.map(function(q){return'“'+q+'”'}).join('; ')+'.');
  if(D.cats.length)P.push('Topics and categories touched: '+D.cats.join(', ')+'.');
  if(D.trails.length)P.push('Related trails discovered ('+D.trails.length+'): '+D.trails.join(', ')+'.');
  if(D.bms.length)P.push('Bookmarked: '+D.bms.join(', ')+'.');
  if(D.refl.length)P.push('Reflections written ('+D.refl.length+', '+D.refl.reduce(function(s,r){return s+(r.words||0)},0)+' words) on: '+D.refl.map(function(r){return r.concept}).join(', ')+'.');
  return(D.k===pdDay()?'Today’s exploration':dayLabel(D.k)+' exploration')+'\n\n'+P.join('\n')+'\n\nThis summary only lists activity recorded in PsycheDive on this date. Nothing here was added by the AI.'}
function empty(D){return!(D.concepts.length||D.qs.length||D.trails.length||D.bms.length||D.refl.length||D.acts.length)}
window.pdDaySum=function(k){if(!k)return'';var D=dayData(k),li=function(a){return a.length?'<ul>'+a.map(function(x){return'<li>'+esc(x)+'</li>'}).join('')+'</ul>':'<p class="tag">None recorded.</p>'};
  var h='<div class="pdday" id="pdday"><h4>'+(k===pdDay()?'Today’s exploration':'Exploration on '+esc(dayLabel(k)))+'</h4>';
  if(empty(D))return h+'<p class="tag">No activity was recorded on this day, so there is nothing to summarise.</p></div>';
  h+='<span class="k">Concepts explored</span>'+li(D.concepts)+
   '<span class="k">Research depth</span>'+(D.arts.length?'<ul>'+D.arts.map(function(a){var v=(a.claims||[]).filter(function(c){return c.verification==='verified'}).length;return'<li>'+esc(a.title)+': '+esc(a.depthLabel||'earlier read')+', '+esc(a.words||0)+' words, '+(a.sources||[]).length+' sources, '+v+' verified'+(a.deep?', deep report':'')+'</li>'}).join('')+'</ul>':'<p class="tag">No new read was written on this day.</p>')+
   '<span class="k">Questions asked</span>'+li(D.qs)+'<span class="k">Topics and categories</span>'+li(D.cats)+'<span class="k">Related trails discovered</span>'+li(D.trails)+'<span class="k">Bookmarked concepts</span>'+li(D.bms)+
   '<span class="k">Reflections</span>'+(D.refl.length?D.refl.map(function(r){return'<details><summary>'+esc(r.concept)+' · '+esc(r.words)+' words</summary><p>'+esc(r.text)+'</p></details>'}).join(''):'<p class="tag">None recorded.</p>');
  var g=(DB.daySum||{})[k];
  h+='<div class="row" style="margin-top:10px"><button class="go" type="button" onclick="pdGenDay(\''+k+'\')">'+(g?'Regenerate day summary':'Generate day summary')+'</button>'+(g?'<button class="fbtn" type="button" onclick="pdCopyDay(\''+k+'\')">Copy</button>':'')+'</div>';
  if(g)h+='<div class="gen" role="region" aria-label="Day summary">'+esc(g.text)+'</div>';
  return h+'</div>'};
window.pdGenDay=function(k){var D=dayData(k);if(empty(D))return;DB.daySum=DB.daySum||{};DB.daySum[k]={text:dayText(D),ts:Date.now()};save();ebmPaint();say('Day summary generated');var e=$('pdday');if(e)e.scrollIntoView({block:'nearest'})};
window.pdCopyDay=function(k){var g=(DB.daySum||{})[k];if(!g)return;try{navigator.clipboard.writeText(g.text).then(function(){toast('Summary copied.',2500)},function(){toast('Could not copy here. Select the text instead.',4000)})}catch(e){toast('Could not copy here. Select the text instead.',4000)}};

/* ---------- 17-19. every panel closes: Esc + a visible close button ---------- */
function closers(){[['setp','Close settings'],['pdaPanel','Close bookmarks']].forEach(function(x){var p=$(x[0]);if(p&&!p.querySelector('.pdclose')){var b=document.createElement('button');b.type='button';b.className='pdclose';b.setAttribute('aria-label',x[1]);b.textContent='✕';b.onclick=function(){p.remove()};p.insertBefore(b,p.firstChild)}})}
document.addEventListener('keydown',function(e){if(e.key!=='Escape')return;var a=$('pdAbout');if(a){pdAbout(false);return}var p=$('pdaPanel');if(p)p.remove()});

/* ---------- motion: visible switch + replay of the opening ---------- */
function savePR(){try{localStorage.rh_p=JSON.stringify(PR)}catch(e){}}
window.pdMotionOn=function(){PR.motion=true;PR.motionHide=false;savePR();location.reload()};
window.pdMotionHide=function(){PR.motionHide=true;savePR();render()};
window.pdReplayIntro=function(){if(RM){toast('Your device is set to reduce motion. Turn on "Always play animations" in Settings first.',6000);return}try{var d=$('ebm');if(d&&d.classList.contains('open'))ebmToggle(false)}catch(e){}var p=$('setp');if(p)p.remove();window.scrollTo(0,0);intro(true)};
var _spr=window.setPR;window.setPR=function(k){var r=_spr.apply(this,arguments);if(k==='motion'){toast('Reloading to apply...',1500);setTimeout(function(){location.reload()},500)}return r};
/* ---------- boot ---------- */
function post(){try{pdArt()}catch(e){console.warn('pdArt',e)}try{wireMap();if(MV.sel&&DB.concepts[MV.sel])mapSelect(MV.sel,true);else pdMapInfo();stars()}catch(e){console.warn('map',e)}
  var bz=$('bz');if(bz&&!bz.getAttribute('role'))bz.setAttribute('aria-busy','true');closers();
  if(S.art&&!S.busy&&LST.last!==S.art.id){LST.last=S.art.id;if('speechSynthesis' in window)try{speechSynthesis.cancel()}catch(e){}say('Read ready: '+S.art.title)}}
function init(){
  var lv=document.createElement('div');lv.id='pdlive';lv.className='pdsr';lv.setAttribute('role','status');lv.setAttribute('aria-live','polite');document.body.appendChild(lv);
  var fs=$('pdaFS');if(fs&&!$('pdfocusb')){var b=document.createElement('button');b.type='button';b.id='pdfocusb';b.setAttribute('aria-label','Toggle focus reading mode');b.setAttribute('aria-pressed','false');b.title='Focus mode';b.textContent='◐';b.onclick=pdFocus;fs.appendChild(b)}
  var sh=document.querySelector('#ebs .ebsh');if(sh&&!$('pdebhome')){var h=document.createElement('button');h.type='button';h.id='pdebhome';h.className='link';h.textContent='🏠 Home';h.onclick=function(){pdaHome()};sh.appendChild(h)}
  try{PAGES.cal=function(){return window.tCal()+pdDaySum(E.cal.sel)};PAGES.play=function(){return window.tPlay()}}catch(e){}
  try{var _c=window.pdCalHTML;window.pdCalHTML=function(){return _c.apply(this,arguments)+pdDaySum(PDX.cal.sel)}}catch(e){}
  try{var _u=window.updBusy;window.updBusy=function(){_u.apply(this,arguments);say(S.status)}}catch(e){}
  try{var _r=window.render;window.render=function(){var o=_r.apply(this,arguments);post();return o}}catch(e){}
  new MutationObserver(function(){closers()}).observe(document.body,{childList:true,subtree:true});
  applyA11y();post()}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();

</script>
